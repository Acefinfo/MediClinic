<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:viewParam name="token" value="#{verifyEmailBean.token}"/>
    <f:event type="preRenderView" listener="#{verifyEmailBean.verify}"/>
</f:metadata>

<h:head><title>Email Verification</title></h:head>
<h:body>
    <p:panel header="Email Verification">
        <h:outputText value="#{verifyEmailBean.resultMessage}"/>
        <br/><br/>
        <p:link outcome="login" value="Back to Login" rendered="#{verifyEmailBean.success}"/>
    </p:panel>
</h:body>
</html>
