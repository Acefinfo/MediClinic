<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head><title>My Profile</title></h:head>
<h:body>
    <h:form id="profileForm">
        <p:growl id="messages" showDetail="true"/>

        <p:panel header="My Profile" rendered="#{patientProfileBean.patient ne null}">
            <p:panelGrid columns="2">
                <p:outputLabel value="Name"/>
                <h:outputText value="#{patientProfileBean.patient.name}"/>

                <p:outputLabel value="Email"/>
                <h:outputText value="#{patientProfileBean.patient.user.email}"/>

                <p:outputLabel for="phone" value="Phone"/>
                <p:inputText id="phone" value="#{patientProfileBean.phone}"/>

                <p:outputLabel for="dob" value="Date of Birth"/>
                <p:calendar id="dob" value="#{patientProfileBean.dateOfBirth}" pattern="yyyy-MM-dd"/>

                <p:outputLabel for="gender" value="Gender"/>
                <p:selectOneMenu id="gender" value="#{patientProfileBean.gender}">
                    <f:selectItem itemLabel="Male" itemValue="MALE"/>
                    <f:selectItem itemLabel="Female" itemValue="FEMALE"/>
                    <f:selectItem itemLabel="Other" itemValue="OTHER"/>
                </p:selectOneMenu>

                <p:outputLabel for="address" value="Address"/>
                <p:inputText id="address" value="#{patientProfileBean.address}"/>

                <p:outputLabel for="allergies" value="Allergies"/>
                <p:inputTextarea id="allergies" value="#{patientProfileBean.allergies}"/>

                <p:outputLabel for="chronic" value="Chronic Conditions"/>
                <p:inputTextarea id="chronic" value="#{patientProfileBean.chronicConditions}"/>

                <p:outputLabel for="ecName" value="Emergency Contact Name"/>
                <p:inputText id="ecName" value="#{patientProfileBean.emergencyContactName}"/>

                <p:outputLabel for="ecPhone" value="Emergency Contact Phone"/>
                <p:inputText id="ecPhone" value="#{patientProfileBean.emergencyContactPhone}"/>
            </p:panelGrid>

            <br/>
            <p:commandButton value="Save Changes" action="#{patientProfileBean.save}" update="profileForm"/>
        </p:panel>

        <p:panel header="No Profile Found" rendered="#{patientProfileBean.patient eq null}">
            <h:outputText value="No patient profile is linked to your account. Contact the front desk."/>
        </p:panel>
    </h:form>
</h:body>
</html>
