<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <f:metadata>
        <f:viewParam name="token" value="#{resetPasswordBean.token}"/>
    </f:metadata>

    <ui:define name="title">Reset Password</ui:define>

    <ui:define name="content">
        <div class="mc-center-wrap">
            <div class="mc-card">
                <h:form id="resetForm">
                    <p:growl id="messages" showDetail="true"/>

                    <p:panel header="Reset Password">
                        <p class="mc-muted" style="margin-top:0;">Choose a new password for your account.</p>

                        <p:panelGrid columns="1" layout="grid" style="width:100%;">

                            <p:outputLabel for="newPassword" value="New Password"/>
                            <p:password id="newPassword" value="#{resetPasswordBean.newPassword}"
                                        required="true" requiredMessage="New password is required."
                                        validatorMessage="Password must be at least 8 characters."
                                        feedback="true" toggleMask="true" match="confirmPassword"
                                        style="width:100%;">
                                <f:validateLength minimum="8"/>
                            </p:password>

                            <p:outputLabel for="confirmPassword" value="Confirm Password"/>
                            <p:password id="confirmPassword" value="#{resetPasswordBean.confirmPassword}"
                                        required="true" requiredMessage="Please confirm your new password."
                                        feedback="false" toggleMask="true" style="width:100%;"/>

                        </p:panelGrid>

                        <br/>
                        <p:commandButton value="Reset Password" icon="pi pi-refresh"
                                          action="#{resetPasswordBean.reset}" update="resetForm messages"
                                          style="width:100%;"/>

                        <div style="text-align:center; margin-top:16px;">
                            <p:link outcome="login" value="Back to Login"/>
                        </div>
                    </p:panel>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
