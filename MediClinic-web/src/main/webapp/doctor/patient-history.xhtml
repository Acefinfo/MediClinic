<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/template.xhtml">

    <f:metadata>
        <f:viewParam name="patientId" value="#{doctorPatientHistoryBean.patientId}"/>
        <f:event type="preRenderView" listener="#{doctorPatientHistoryBean.load}"/>
    </f:metadata>

    <ui:define name="title">Patient History</ui:define>

    <ui:define name="content">
        <h1 class="mc-page-title">Patient History</h1>

        <h:panelGroup rendered="#{doctorPatientHistoryBean.accessDenied}">
            <p:panel header="Unable to Load History">
                <h:outputText value="#{doctorPatientHistoryBean.accessDeniedMessage}"/>
            </p:panel>
        </h:panelGroup>

        <h:panelGroup rendered="#{not doctorPatientHistoryBean.accessDenied}">

            <p:panel header="Patient Profile" style="margin-bottom:20px;" rendered="#{doctorPatientHistoryBean.patient ne null}">
                <p:panelGrid columns="2">
                    <p:outputLabel value="Name" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.name}"/>

                    <p:outputLabel value="Phone" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.phone}"/>

                    <p:outputLabel value="Date of Birth" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.dateOfBirth}">
                        <f:convertDateTime pattern="yyyy-MM-dd" timeZone="UTC"/>
                    </h:outputText>

                    <p:outputLabel value="Gender" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.gender}"/>

                    <p:outputLabel value="Allergies" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.allergies}"
                                  rendered="#{not empty doctorPatientHistoryBean.patient.allergies}"/>
                    <h:outputText value="None recorded" styleClass="mc-muted"
                                  rendered="#{empty doctorPatientHistoryBean.patient.allergies}"/>

                    <p:outputLabel value="Chronic Conditions" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.chronicConditions}"
                                  rendered="#{not empty doctorPatientHistoryBean.patient.chronicConditions}"/>
                    <h:outputText value="None recorded" styleClass="mc-muted"
                                  rendered="#{empty doctorPatientHistoryBean.patient.chronicConditions}"/>

                    <p:outputLabel value="Emergency Contact" style="font-weight:bold"/>
                    <h:outputText value="#{doctorPatientHistoryBean.patient.emergencyContactName} (#{doctorPatientHistoryBean.patient.emergencyContactPhone})"
                                  rendered="#{not empty doctorPatientHistoryBean.patient.emergencyContactName}"/>
                    <h:outputText value="None recorded" styleClass="mc-muted"
                                  rendered="#{empty doctorPatientHistoryBean.patient.emergencyContactName}"/>
                </p:panelGrid>
            </p:panel>

            <h1 class="mc-page-title" style="font-size:1.2em;">Consultation History</h1>

            <ui:repeat var="g" value="#{doctorPatientHistoryBean.groups}">
                <p:panel style="margin-bottom:20px" toggleable="true" collapsed="true">
                    <f:facet name="header">
                        <h:outputText value="Consultation - #{g.consultation.consultationDate}">
                            <f:convertDateTime pattern="yyyy-MM-dd" timeZone="UTC"/>
                        </h:outputText>
                    </f:facet>

                    <p:panelGrid columns="2">
                        <p:outputLabel value="Doctor" style="font-weight:bold"/>
                        <h:outputText value="#{g.consultation.appointment.doctor.name}"/>

                        <p:outputLabel value="Symptoms" style="font-weight:bold"/>
                        <h:outputText value="#{g.consultation.symptoms}"/>

                        <p:outputLabel value="Diagnosis" style="font-weight:bold"/>
                        <h:outputText value="#{g.consultation.diagnosis}"/>

                        <p:outputLabel value="Notes" style="font-weight:bold"/>
                        <h:outputText value="#{g.consultation.notes}"/>
                    </p:panelGrid>

                    <br/>
                    <p:outputLabel value="Prescriptions" style="font-weight:bold"/>
                    <p:dataTable var="rx" value="#{g.prescriptions}" rowKey="#{rx.id}"
                                 rendered="#{not empty g.prescriptions}">
                        <p:column headerText="Medicine"><h:outputText value="#{rx.medicineName}"/></p:column>
                        <p:column headerText="Dosage"><h:outputText value="#{rx.dosage}"/></p:column>
                        <p:column headerText="Frequency"><h:outputText value="#{rx.frequency}"/></p:column>
                        <p:column headerText="Duration"><h:outputText value="#{rx.duration}"/></p:column>
                        <p:column headerText="Instructions"><h:outputText value="#{rx.instructions}"/></p:column>
                    </p:dataTable>
                    <h:outputText value="No prescriptions recorded for this consultation."
                                  rendered="#{empty g.prescriptions}" styleClass="mc-muted"/>
                </p:panel>
            </ui:repeat>

            <h:outputText value="No consultation history recorded for this patient yet."
                          rendered="#{empty doctorPatientHistoryBean.groups}" styleClass="mc-muted"/>

        </h:panelGroup>
    </ui:define>

</ui:composition>
