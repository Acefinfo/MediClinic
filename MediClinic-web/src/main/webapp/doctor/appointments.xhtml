<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">My Appointments</ui:define>

    <ui:define name="content">
        <h1 class="mc-page-title">My Appointments</h1>

        <h:form id="apptForm">

            <p:panel header="Search">
                <p:inputText value="#{doctorAppointmentBean.searchKeyword}"
                             placeholder="Search by patient name, reason, or status"
                             style="width:320px;"/>
                <p:commandButton value="Search" icon="pi pi-search"
                                  action="#{doctorAppointmentBean.search}" update="apptForm"/>
                <p:commandButton value="Reset" icon="pi pi-times"
                                  action="#{doctorAppointmentBean.clearSearch}" update="apptForm"/>
            </p:panel>

            <br/>

            <p:panel header="Today's Appointments">
                <p:dataTable var="a" value="#{doctorAppointmentBean.todayAppointments}" rowKey="#{a.id}">

                    <p:column headerText="Patient"><h:outputText value="#{a.patient.name}"/></p:column>

                    <p:column headerText="Time">
                        <h:outputText value="#{a.appointmentTime}"><f:convertDateTime pattern="HH:mm" timeZone="UTC"/></h:outputText>
                    </p:column>

                    <p:column headerText="Status"><h:outputText value="#{a.status}"/></p:column>

                    <p:column headerText="Reason"><h:outputText value="#{a.reason}"/></p:column>

                    <p:column headerText="Consultation">
                        <p:link outcome="/consultation" value="Start Consultation" rendered="#{a.status == 'APPROVED'}">
                            <f:param name="appointmentId" value="#{a.id}"/>
                        </p:link>
                        <p:link outcome="/consultation" value="View Consultation" rendered="#{a.status == 'COMPLETED'}">
                            <f:param name="appointmentId" value="#{a.id}"/>
                        </p:link>
                    </p:column>

                </p:dataTable>

                <h:outputText value="No appointments scheduled for today."
                               rendered="#{empty doctorAppointmentBean.todayAppointments}" styleClass="mc-muted"/>
            </p:panel>

            <br/>

            <p:panel header="Other Appointments">
                <p:dataTable var="a" value="#{doctorAppointmentBean.otherAppointments}" rowKey="#{a.id}">

                    <p:column headerText="Patient"><h:outputText value="#{a.patient.name}"/></p:column>

                    <p:column headerText="Date">
                        <h:outputText value="#{a.appointmentDate}"><f:convertDateTime pattern="yyyy-MM-dd" timeZone="UTC"/></h:outputText>
                    </p:column>

                    <p:column headerText="Time">
                        <h:outputText value="#{a.appointmentTime}"><f:convertDateTime pattern="HH:mm" timeZone="UTC"/></h:outputText>
                    </p:column>

                    <p:column headerText="Status"><h:outputText value="#{a.status}"/></p:column>

                    <p:column headerText="Reason"><h:outputText value="#{a.reason}"/></p:column>

                    <p:column headerText="Consultation">
                        <p:link outcome="/consultation" value="Start Consultation" rendered="#{a.status == 'APPROVED'}">
                            <f:param name="appointmentId" value="#{a.id}"/>
                        </p:link>
                        <p:link outcome="/consultation" value="View Consultation" rendered="#{a.status == 'COMPLETED'}">
                            <f:param name="appointmentId" value="#{a.id}"/>
                        </p:link>
                    </p:column>

                </p:dataTable>

                <h:outputText value="No other appointments found."
                               rendered="#{empty doctorAppointmentBean.otherAppointments}" styleClass="mc-muted"/>
            </p:panel>

        </h:form>
    </ui:define>

</ui:composition>
