<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">My Profile</ui:define>

    <ui:define name="content">
        <h1 class="mc-page-title">My Doctor Profile</h1>

        <h:form id="profileForm">
            <p:growl id="messages" showDetail="true"/>

            <p:panel header="My Profile" rendered="#{doctorProfileBean.doctor ne null}">
                <p:panelGrid columns="2">

                    <p:outputLabel value="Name"/>
                    <h:outputText value="#{doctorProfileBean.doctor.name}"/>

                    <p:outputLabel value="Email"/>
                    <h:outputText value="#{doctorProfileBean.doctor.user.email}"/>

                    <p:outputLabel for="specialization" value="Specialization"/>
                    <p:inputText id="specialization" value="#{doctorProfileBean.specialization}"/>

                    <p:outputLabel for="fee" value="Consultation Fee"/>
                    <p:inputText id="fee" value="#{doctorProfileBean.fee}"/>

                    <p:outputLabel for="bio" value="Bio"/>
                    <p:inputTextarea id="bio" value="#{doctorProfileBean.bio}" rows="5"/>

                </p:panelGrid>

                <br/>
                <p:commandButton value="Save Changes" action="#{doctorProfileBean.save}" update="profileForm"/>
                <p:spacer width="10"/>
                <p:link outcome="/doctor/schedule" value="Manage My Availability"/>

            </p:panel>

            <p:panel header="No Doctor Found" rendered="#{doctorProfileBean.doctor eq null}">
                <h:outputText value="No doctor profile linked to your account. Contact the administrator."/>
            </p:panel>

        </h:form>
        
    </ui:define>

</ui:composition>
