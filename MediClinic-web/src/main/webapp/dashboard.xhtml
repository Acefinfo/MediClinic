<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">Dashboard</ui:define>

    <ui:define name="content">
        <h:form id="dashboardForm">

            <div class="mc-section" style="display:flex; align-items:center; gap:16px;">
                <p:graphicImage value="/photo/#{loggedInUser.user.id}" cache="false" width="64"
                                rendered="#{loggedInUser.user.photoPath ne null}"
                                style="border-radius:50%; border:2px solid #0d9488;"/>
                <div>
                    <h1 class="mc-page-title" style="margin-bottom:2px;">
                        Welcome, #{loggedInUser.user.email}
                    </h1>
                    <span class="mc-muted">Role: #{loggedInUser.roleName}</span>
                </div>
            </div>

            <!-- ===== Admin / Receptionist widgets ===== -->
            <p:panelGrid columns="4" layout="grid" columnClasses="ui-g-3,ui-g-3,ui-g-3,ui-g-3"
                         rendered="#{loggedInUser.roleName == 'ADMIN' or loggedInUser.roleName == 'RECEPTIONIST'}">
                <p:panel header="Today's Appointments">
                    <h:outputText value="#{dashboardBean.todayAppointments}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Pending Approvals">
                    <h:outputText value="#{dashboardBean.pendingApprovals}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Unpaid Invoices">
                    <h:outputText value="#{dashboardBean.unpaidInvoices}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Revenue This Month">
                    <h:outputText value="#{dashboardBean.revenueThisMonth}" styleClass="mc-stat-value">
                        <f:convertNumber type="currency" currencySymbol="Rs. "/>
                    </h:outputText>
                </p:panel>
                <p:panel header="Total Patients" rendered="#{loggedInUser.roleName == 'ADMIN'}">
                    <h:outputText value="#{dashboardBean.totalPatients}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Total Doctors" rendered="#{loggedInUser.roleName == 'ADMIN'}">
                    <h:outputText value="#{dashboardBean.totalDoctors}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Total Revenue (All Time)" rendered="#{loggedInUser.roleName == 'ADMIN'}">
                    <h:outputText value="#{dashboardBean.totalRevenue}" styleClass="mc-stat-value">
                        <f:convertNumber type="currency" currencySymbol="Rs. "/>
                    </h:outputText>
                </p:panel>
            </p:panelGrid>

            <p:panel header="Recent Activity" toggleable="true"
                     rendered="#{loggedInUser.roleName == 'ADMIN' or loggedInUser.roleName == 'RECEPTIONIST'}"
                     style="margin-top:20px;">
                <p:dataTable value="#{dashboardBean.recentActivity}" var="log" rows="8">
                    <p:column headerText="When"><h:outputText value="#{log.timestamp}"><f:convertDateTime pattern="dd MMM yyyy HH:mm"/></h:outputText></p:column>
                    <p:column headerText="Action"><h:outputText value="#{log.action}"/></p:column>
                    <p:column headerText="Details"><h:outputText value="#{log.details}"/></p:column>
                </p:dataTable>
            </p:panel>

            <!-- ===== Doctor widgets ===== -->
            <p:panelGrid columns="2" layout="grid" columnClasses="ui-g-6,ui-g-6"
                         rendered="#{loggedInUser.roleName == 'DOCTOR'}">
                <p:panel header="Upcoming Appointments">
                    <h:outputText value="#{dashboardBean.myUpcomingAppointments}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Completed Consultations">
                    <h:outputText value="#{dashboardBean.myCompletedConsultations}" styleClass="mc-stat-value"/>
                </p:panel>
            </p:panelGrid>
            <p:panel header="Today's Appointments" rendered="#{loggedInUser.roleName == 'DOCTOR'}" style="margin-top:20px;">
                <p:dataTable value="#{dashboardBean.myTodaysAppointments}" var="appt" rows="10">
                    <p:column headerText="Time"><h:outputText value="#{appt.appointmentTime}"><f:convertDateTime pattern="HH:mm" type="time"/></h:outputText></p:column>
                    <p:column headerText="Patient"><h:outputText value="#{appt.patient.name}"/></p:column>
                    <p:column headerText="Status"><h:outputText value="#{appt.status}"/></p:column>
                </p:dataTable>
            </p:panel>

            <!-- ===== Patient widgets ===== -->
            <p:panelGrid columns="2" layout="grid" columnClasses="ui-g-6,ui-g-6"
                         rendered="#{loggedInUser.roleName == 'PATIENT'}">
                <p:panel header="Upcoming Appointments">
                    <h:outputText value="#{dashboardBean.myUpcomingAppointmentsAsPatient}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="Unpaid Invoices">
                    <h:outputText value="#{dashboardBean.myUnpaidInvoices}" styleClass="mc-stat-value"/>
                </p:panel>
            </p:panelGrid>


        </h:form>
    </ui:define>

</ui:composition>
