<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">#{msg['nav.dashboard']}</ui:define>

    <ui:define name="content">
        <h:form id="dashboardForm">

            <div class="mc-section" style="display:flex; align-items:center; gap:16px;">
                <p:graphicImage value="/photo/#{loggedInUser.user.id}" cache="false" width="64"
                                rendered="#{loggedInUser.user.photoPath ne null}"
                                style="border-radius:50%; border:2px solid #0d9488;"/>
                <div>
                    <h1 class="mc-page-title" style="margin-bottom:2px;">
                        #{msg['dashboard.welcome']}, #{loggedInUser.user.email}
                    </h1>
                    <span class="mc-muted">#{msg['dashboard.role']}: #{loggedInUser.roleName}</span>
                </div>
            </div>

            <!-- ===== Admin / Receptionist widgets ===== -->
            <p:panelGrid columns="4" layout="grid" columnClasses="ui-g-3,ui-g-3,ui-g-3,ui-g-3"
                         rendered="#{loggedInUser.roleName == 'ADMIN' or loggedInUser.roleName == 'RECEPTIONIST'}">
                <p:panel header="#{msg['dashboard.todayAppointments']}">
                    <h:outputText value="#{dashboardBean.todayAppointments}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.pendingApprovals']}">
                    <h:outputText value="#{dashboardBean.pendingApprovals}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.unpaidInvoices']}">
                    <h:outputText value="#{dashboardBean.unpaidInvoices}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.revenueThisMonth']}">
                    <h:outputText value="#{dashboardBean.revenueThisMonth}" styleClass="mc-stat-value">
                        <f:convertNumber type="currency" currencySymbol="Rs. "/>
                    </h:outputText>
                </p:panel>
                <p:panel header="#{msg['dashboard.totalPatients']}" rendered="#{loggedInUser.roleName == 'ADMIN'}">
                    <h:outputText value="#{dashboardBean.totalPatients}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.totalDoctors']}" rendered="#{loggedInUser.roleName == 'ADMIN'}">
                    <h:outputText value="#{dashboardBean.totalDoctors}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.totalRevenue']}" rendered="#{loggedInUser.roleName == 'ADMIN'}">
                    <h:outputText value="#{dashboardBean.totalRevenue}" styleClass="mc-stat-value">
                        <f:convertNumber type="currency" currencySymbol="Rs. "/>
                    </h:outputText>
                </p:panel>
            </p:panelGrid>

            <p:panel header="#{msg['dashboard.recentActivity']}" toggleable="true"
                     rendered="#{loggedInUser.roleName == 'ADMIN' or loggedInUser.roleName == 'RECEPTIONIST'}"
                     style="margin-top:20px;">
                <p:dataTable value="#{dashboardBean.recentActivity}" var="log" rows="8">
                    <p:column headerText="#{msg['dashboard.when']}"><h:outputText value="#{log.timestamp}"><f:convertDateTime pattern="dd MMM yyyy HH:mm"/></h:outputText></p:column>
                    <p:column headerText="#{msg['dashboard.action']}"><h:outputText value="#{log.action}"/></p:column>
                    <p:column headerText="#{msg['dashboard.details']}"><h:outputText value="#{log.details}"/></p:column>
                </p:dataTable>
            </p:panel>

            <!-- ===== Doctor widgets ===== -->
            <p:panelGrid columns="2" layout="grid" columnClasses="ui-g-6,ui-g-6"
                         rendered="#{loggedInUser.roleName == 'DOCTOR'}">
                <p:panel header="#{msg['dashboard.upcomingAppointments']}">
                    <h:outputText value="#{dashboardBean.myUpcomingAppointments}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.completedConsultations']}">
                    <h:outputText value="#{dashboardBean.myCompletedConsultations}" styleClass="mc-stat-value"/>
                </p:panel>
            </p:panelGrid>
            <p:panel header="#{msg['dashboard.todayAppointments']}" rendered="#{loggedInUser.roleName == 'DOCTOR'}" style="margin-top:20px;">
                <p:dataTable value="#{dashboardBean.myTodaysAppointments}" var="appt" rows="10">
                    <p:column headerText="#{msg['common.time']}"><h:outputText value="#{appt.appointmentTime}"><f:convertDateTime pattern="HH:mm" type="time"/></h:outputText></p:column>
                    <p:column headerText="#{msg['consultation.patient']}"><h:outputText value="#{appt.patient.name}"/></p:column>
                    <p:column headerText="#{msg['common.status']}"><h:outputText value="#{appt.status}"/></p:column>
                </p:dataTable>
            </p:panel>

            <!-- ===== Patient widgets ===== -->
            <p:panelGrid columns="2" layout="grid" columnClasses="ui-g-6,ui-g-6"
                         rendered="#{loggedInUser.roleName == 'PATIENT'}">
                <p:panel header="#{msg['dashboard.upcomingAppointments']}">
                    <h:outputText value="#{dashboardBean.myUpcomingAppointmentsAsPatient}" styleClass="mc-stat-value"/>
                </p:panel>
                <p:panel header="#{msg['dashboard.unpaidInvoices']}">
                    <h:outputText value="#{dashboardBean.myUnpaidInvoices}" styleClass="mc-stat-value"/>
                </p:panel>
            </p:panelGrid>


        </h:form>
    </ui:define>

</ui:composition>
