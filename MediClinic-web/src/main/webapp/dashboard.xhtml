<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head><title>Dashboard</title></h:head>
<h:body>
    <h:form id="dashboardForm">
        <p:panel header="Dashboard">
            <h:outputText value="Welcome, #{loggedInUser.user.email} (#{loggedInUser.roleName})"/>
            <br/><br/>
            <p:commandButton value="Logout" action="#{loggedInUser.logout}" ajax="false"/>

            <br/><br/>
            <p:link outcome="/admin/staff-list" value="Manage Staff" rendered="#{loggedInUser.roleName == 'ADMIN'}"/>
            <p:link outcome="/receptionist/patients" value="Manage Patients" rendered="#{loggedInUser.roleName == 'RECEPTIONIST'}"/>
            <p:link outcome="/admin/patients" value="View Patients" rendered="#{loggedInUser.roleName == 'ADMIN'}"/>
            <p:link outcome="/patient/profile" value="My Profile" rendered="#{loggedInUser.roleName == 'PATIENT'}"/>
        </p:panel>
    </h:form>
</h:body>
</html>
