<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">Forgot Password</ui:define>

    <ui:define name="content">
        <div class="mc-center-wrap">
            <div class="mc-card">
                <h:form id="forgotForm">
                    <p:growl id="messages" showDetail="true"/>

                    <p:panel header="Forgot Password">
                        <h:panelGroup rendered="#{not forgotPasswordBean.submitted}">
                            <p class="mc-muted" style="margin-top:0;">
                                Enter the email associated with your account and we'll send you a reset link.
                            </p>

                            <p:outputLabel for="email" value="Email"/>
                            <br/>
                            <p:inputText id="email" value="#{forgotPasswordBean.email}"
                                         required="true" requiredMessage="Email is required."
                                         validatorMessage="Please enter a valid email address."
                                         style="width:100%;">
                                <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"/>
                            </p:inputText>
                            <br/><br/>
                            <p:commandButton value="Send Reset Link" icon="pi pi-send"
                                              action="#{forgotPasswordBean.submit}" update="forgotForm messages"
                                              style="width:100%;"/>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{forgotPasswordBean.submitted}">
                            <h:outputText value="If an account exists for that email, a reset link has been sent."/>
                        </h:panelGroup>

                        <div style="text-align:center; margin-top:16px;">
                            <p:link outcome="login" value="Back to Login"/>
                        </div>
                    </p:panel>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
