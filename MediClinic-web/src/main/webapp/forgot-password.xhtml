<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head><title>Forgot Password</title></h:head>
<h:body>
    <h:form id="forgotForm">
        <p:panel header="Forgot Password">
            <h:panelGroup rendered="#{not forgotPasswordBean.submitted}">
                <p:outputLabel for="email" value="Email"/>
                <p:inputText id="email" value="#{forgotPasswordBean.email}" required="true" requiredMessage="Email is required."/>
                <br/><br/>
                <p:commandButton value="Send Reset Link" action="#{forgotPasswordBean.submit}" update="forgotForm"/>
            </h:panelGroup>
            <h:panelGroup rendered="#{forgotPasswordBean.submitted}">
                <h:outputText value="If an account exists for that email, a reset link has been sent."/>
            </h:panelGroup>
        </p:panel>
    </h:form>
</h:body>
</html>
