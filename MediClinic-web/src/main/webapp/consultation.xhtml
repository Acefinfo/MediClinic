<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <f:metadata>
        <f:viewParam name="appointmentId" value="#{consultationBean.appointmentId}"/>
        <f:viewAction action="#{consultationBean.load}"/>
    </f:metadata>

    <ui:define name="title">Consultation</ui:define>

    <ui:define name="content">
        <h1 class="mc-page-title">Consultation</h1>

        <h:panelGroup rendered="#{consultationBean.accessDenied}">
            <p:messages showDetail="true"/>
            <h:outputText value="You don't have access to this page"/>
        </h:panelGroup>

        <h:form id="consultForm" rendered="#{not consultationBean.accessDenied}">

            <p:growl id="messages" showDetail="true"/>

            <p:panel header="Appointment Detail">

                <p:panelGrid columns="2">

                    <p:outputLabel value="Patient"/>
                    <h:outputText value="#{consultationBean.appointment.patient.name}"/>

                    <p:outputLabel value="Doctor"/>
                    <h:outputText value="#{consultationBean.appointment.doctor.name}"/>

                    <p:outputLabel value="Date"/>
                    <h:outputText value="#{consultationBean.appointment.appointmentDate}">
                        <f:convertDateTime pattern="yyyy-MM-dd" timeZone="UTC"/>
                    </h:outputText>

                    <p:outputLabel value="Status"/>
                    <h:outputText value="#{consultationBean.appointment.status}"/>

                    <p:outputLabel value="Reason"/>
                    <h:outputText value="#{consultationBean.appointment.reason}"/>

                </p:panelGrid>
            </p:panel>

            <br/><br/>

            <p:panel header="Consultation">

                <p:panelGrid columns="2">

                    <p:outputLabel for="symptoms" value="Symptoms"/>
                    <p:inputTextarea id="symptoms" value="#{consultationBean.symptoms}" rows="3" disabled="#{not consultationBean.canEdit}"/>

                    <p:outputLabel for="diagnosis" value="Diagnosis"/>
                    <p:inputTextarea id="diagnosis" value="#{consultationBean.diagnosis}" rows="3" disabled="#{not consultationBean.canEdit}"/>

                    <p:outputLabel for="notes" value="Notes"/>
                    <p:inputTextarea id="notes" value="#{consultationBean.notes}" rows="4" disabled="#{not consultationBean.canEdit}"/>

                </p:panelGrid>

                <br/>

                <p:commandButton value="Save Consultation" action="#{consultationBean.save}" update="consultForm prescriptionPanel" rendered="#{consultationBean.canEdit}"/>
                <h:outputText value="View only — only the treating doctor can edit this consultation." rendered="#{not consultationBean.canEdit}"/>

            </p:panel>

            <br/>

            <h:panelGroup id="prescriptionPanel" layout="block">
                <p:panel header="Prescriptions" rendered="#{consultationBean.consultation ne null}">

                    <p:dataTable var="rx" value="#{consultationBean.prescriptions}" rowKey="#{rx.id}" rendered="#{not empty consultationBean.prescriptions}">

                        <p:column headerText="Medicine">
                            <h:outputText value="#{rx.medicineName}"/>
                        </p:column>

                        <p:column headerText="Dosage">
                            <h:outputText value="#{rx.dosage}"/>
                        </p:column>

                        <p:column headerText="Frequency">
                            <h:outputText value="#{rx.frequency}"/>
                        </p:column>

                        <p:column headerText="Duration">
                            <h:outputText value="#{rx.duration}"/>
                        </p:column>

                        <p:column headerText="Instructions">
                            <h:outputText value="#{rx.instructions}"/>
                        </p:column>

                    </p:dataTable>

                    <h:outputText value="No prescriptions recorded yet." rendered="#{empty consultationBean.prescriptions}"/>

                    <br/><br/>
                    <p:commandButton value="Add Prescription" icon="pi pi-plus"
                                     oncomplete="PF('addRxDialog').show()" process="@this"
                                     rendered="#{consultationBean.canEdit}"/>

                </p:panel>
            </h:panelGroup>
        </h:form>

        <p:dialog header="Add Prescription" widgetVar="addRxDialog" modal="true">
            <h:form id="rxForm">
                <p:panelGrid columns="2">

                    <p:outputLabel for="med" value="Medicine Name"/>
                    <p:inputText id="med" value="#{consultationBean.newMedicineName}"/>

                    <p:outputLabel for="dosage" value="Dosage"/>
                    <p:inputText id="dosage" value="#{consultationBean.newDosage}"/>

                    <p:outputLabel for="freq" value="Frequency"/>
                    <p:inputText id="freq" value="#{consultationBean.newFrequency}"/>

                    <p:outputLabel for="dur" value="Duration"/>
                    <p:inputText id="dur" value="#{consultationBean.newDuration}"/>

                    <p:outputLabel for="instr" value="Instructions"/>
                    <p:inputTextarea id="instr" value="#{consultationBean.newInstructions}" rows="3"/>
                </p:panelGrid>

                <br/>
                <p:commandButton value="Save" action="#{consultationBean.addPrescription}"
                                 oncomplete="if (!args.validationFailed) PF('addRxDialog').hide();"
                                 update=":consultForm:prescriptionPanel"/>
            </h:form>
        </p:dialog>
    </ui:define>

</ui:composition>
