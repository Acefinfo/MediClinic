<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">Login</ui:define>

    <ui:define name="content">
        <div class="mc-center-wrap">
            <div class="mc-card">
                <h:form id="loginForm">
                    <p:growl id="message" showDetail="true"/>

                    <p:panel header="Welcome Back">
                        <p class="mc-muted" style="margin-top:0;">Sign in to your MediClinic account.</p>

                        <p:panelGrid columns="1" layout="grid" style="width:100%;">

                            <p:outputLabel for="email" value="Email"/>
                            <p:inputText id="email" value="#{loginBean.email}"
                                         required="true" requiredMessage="Email is required"
                                         validatorMessage="Please enter a valid email address"
                                         placeholder="you@example.com" style="width:100%;">
                                <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"/>
                            </p:inputText>

                            <p:outputLabel for="password" value="Password"/>
                            <p:password id="password" value="#{loginBean.password}"
                                        required="true" requiredMessage="Password is required"
                                        feedback="false" toggleMask="true"
                                        placeholder="Enter password" style="width:100%;"/>

                        </p:panelGrid>

                        <br/>
                        <p:commandButton value="Log In" icon="pi pi-sign-in" action="#{loginBean.login}"
                                          update="loginForm message" style="width:100%;"/>

                        <div style="text-align:center; margin-top:16px;">
                            <p:link outcome="register" value="Don't have an account? Register"/>
                            <br/>
                            <p:link outcome="forgot-password" value="Forgot your password?"/>
                        </div>
                    </p:panel>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
