<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui">
    
    <h:head>
        <title>Login</title>
    </h:head>
    
    <h:body>
        <h:form id ="loginForm">
            
            <p:growl id="message" showDetail="true"/>
            
            <p:panel header="Login">
                <p:panelGrid columns="2">
                    
                    <p:outputLabel for="email" value="Email"/>
                    <p:inputText id ="email" value="#{loginBean.email}" required="true" requiredMessage="Email is required" placeholder="Enter email"/>
                    
                    <p:outputLabel for="password" value="Password"/>
                    <p:inputText id ="password" value="#{loginBean.password}" required="true" requiredMessage="Password is required" placeholder="Enter Password"/>
                    
                </p:panelGrid>
                
                <br/>
                <p:commandButton value="LogIn" icon="pi pi-sign-in" action="#{loginBean.login}" update="loginForm message"/>
                
                <br/><br/>
                <p:link outcome="register" value="Don't have an account? Register"/>
                <br/>
                <p:link outcome="forgot-password" value="Forgot your password?"/>

            </p:panel>
            
        </h:form>
        
        
    </h:body>
    
    
    
    
    
    
</html>
