<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head><title>Appointments</title></h:head>
    <h:body>
        <h:form id="apptForm">
            <p:growl id="messages" showDetail="true"/>

            <p:panel header="All Appointments">
                <p:dataTable var="a" value="#{staffAppointmentBean.appointments}" rowKey="#{a.id}">

                    <p:column headerText="Patient"><h:outputText value="#{a.patient.name}"/></p:column>

                    <p:column headerText="Doctor"><h:outputText value="#{a.doctor.name}"/></p:column>

                    <p:column headerText="Date">
                        <h:outputText value="#{a.appointmentDate}"><f:convertDateTime pattern="yyyy-MM-dd" timeZone="UTC"/></h:outputText>
                    </p:column>

                    <p:column headerText="Time">
                        <h:outputText value="#{a.appointmentTime}"><f:convertDateTime pattern="HH:mm" timeZone="UTC"/></h:outputText>
                    </p:column>

                    <p:column headerText="Status"><h:outputText value="#{a.status}"/></p:column>

                    <p:column headerText="Reason"><h:outputText value="#{a.reason}"/></p:column>

                    <p:column headerText="Consultation">
                        <p:commandButton value="View Consultation" icon="pi pi-eye"
                                         actionListener="#{staffAppointmentBean.loadConsultation(a)}"
                                         oncomplete="PF('consultDialog').show()" update=":consultDialogForm" process="@this"
                                         rendered="#{a.status == 'COMPLETED'}"/>
                    </p:column>

                    <p:column headerText="Actions">
                        <p:commandButton value="Approve" icon="pi pi-check"
                                         action="#{staffAppointmentBean.approve(a)}" update="apptForm"
                                         rendered="#{a.status == 'REQUESTED'}"/>
                        <p:commandButton value="Cancel" icon="pi pi-times"
                                         action="#{staffAppointmentBean.cancel(a)}" update="apptForm"
                                         rendered="#{a.status == 'REQUESTED' or a.status == 'APPROVED'}"/>

                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
       
        <p:dialog header="Consultation Details" widgetVar="consultDialog" modal="true" width="500">
            <h:form id="consultDialogForm">
                <p:panelGrid columns="2" rendered="#{staffAppointmentBean.viewAppointment ne null}">
                    <p:outputLabel value="Patient"/>
                    <h:outputText value="#{staffAppointmentBean.viewAppointment.patient.name}"/>

                    <p:outputLabel value="Doctor"/>
                    <h:outputText value="#{staffAppointmentBean.viewAppointment.doctor.name}"/>

                    <p:outputLabel value="Date"/>
                    <h:outputText value="#{staffAppointmentBean.viewAppointment.appointmentDate}">
                        <f:convertDateTime pattern="yyyy-MM-dd" timeZone="UTC"/>
                    </h:outputText>

                    <p:outputLabel value="Symptoms"/>
                    <h:outputText value="#{staffAppointmentBean.viewConsultation.symptoms}"/>

                    <p:outputLabel value="Diagnosis"/>
                    <h:outputText value="#{staffAppointmentBean.viewConsultation.diagnosis}"/>

                    <p:outputLabel value="Notes"/>
                    <h:outputText value="#{staffAppointmentBean.viewConsultation.notes}"/>
                </p:panelGrid>

                <h:outputText value="No consultation record found for this appointment."
                              rendered="#{staffAppointmentBean.viewAppointment ne null and staffAppointmentBean.viewConsultation eq null}"/>

                <br/><br/>

                <h:panelGroup rendered="#{staffAppointmentBean.viewConsultation ne null}">
                    <p:outputLabel value="Prescriptions" style="font-weight:bold"/>
                    <p:dataTable var="rx" value="#{staffAppointmentBean.viewPrescriptions}" rowKey="#{rx.id}"
                                 rendered="#{not empty staffAppointmentBean.viewPrescriptions}">
                        
                        <p:column headerText="Medicine">
                            <h:outputText value="#{rx.medicineName}"/>
                        </p:column>
                        
                        <p:column headerText="Dosage">
                            <h:outputText value="#{rx.dosage}"/>
                        </p:column>
                        
                        <p:column headerText="Frequency">
                            <h:outputText value="#{rx.frequency}"/>
                        </p:column>
                        
                        <p:column headerText="Duration">
                            <h:outputText value="#{rx.duration}"/>
                        </p:column>
                        
                        <p:column headerText="Instructions">
                            <h:outputText value="#{rx.instructions}"/>
                        </p:column>
                        
                    </p:dataTable>
                    <h:outputText value="No prescriptions recorded yet." rendered="#{empty staffAppointmentBean.viewPrescriptions}"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </h:body>
</html>
