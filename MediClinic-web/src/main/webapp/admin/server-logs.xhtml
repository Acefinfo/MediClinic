<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">Server Logs</ui:define>

    <ui:define name="content">
        <h1 class="mc-page-title">Server Logs</h1>
        <p class="mc-muted" style="margin-top:-10px;">
            A record of activity across the system — logins, staff changes, appointments, billing, and more.
        </p>

        <h:form id="logsForm">
            <p:panel header="Activity Log">

                <p:dataTable var="log" value="#{serverLogsBean.logs}" rowKey="#{log.id}"
                             lazy="true" paginator="true" rows="7"
                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                             currentPageReportTemplate="Page {currentPage} of {totalPages} ({totalRecords} entries)">

                    <p:column headerText="Timestamp">
                        <h:outputText value="#{log.timestamp}"><f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" timeZone="UTC"/></h:outputText>
                    </p:column>

                    <p:column headerText="User">
                        <h:outputText value="#{log.user.email}" rendered="#{log.user ne null}"/>
                        <h:outputText value="System" rendered="#{log.user eq null}"/>
                    </p:column>

                    <p:column headerText="Action">
                        <h:outputText value="#{log.action}"/>
                    </p:column>

                    <p:column headerText="Entity">
                        <h:outputText value="#{log.entityName}"/>
                        <h:outputText value=" ##{log.entityId}" rendered="#{log.entityId ne null}"/>
                    </p:column>

                    <p:column headerText="Details">
                        <h:outputText value="#{log.details}"/>
                    </p:column>

                </p:dataTable>

            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
