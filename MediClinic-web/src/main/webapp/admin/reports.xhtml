<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui"
                 template="/template.xhtml">

    <ui:define name="title">Reports</ui:define>

    <ui:define name="content">
        <h1 class="mc-page-title">Reports</h1>

        <h:form id="reportsForm">
            <p:panel header="Revenue — Last 6 Months" style="margin-bottom:20px;">
                <span class="mc-stat-value">#{reportsBean.totalRevenueLast6Months}</span>
                <span class="mc-muted"> total</span>
            </p:panel>

                <br/>

            <p:panel header="Doctor Performance">
                <p:dataTable value="#{reportsBean.doctorPerformance}" var="row">
                    <p:column headerText="Doctor"><h:outputText value="#{row.doctorName}"/></p:column>
                    <p:column headerText="Completed Appointments"><h:outputText value="#{row.completedAppointments}"/></p:column>
                    <p:column headerText="Revenue Generated">
                        <h:outputText value="#{row.revenue}"><f:convertNumber type="currency" currencySymbol="$"/></h:outputText>
                    </p:column>
                </p:dataTable>
            </p:panel>
                
        </h:form>
        
    </ui:define>

</ui:composition>
