<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head><title>Reports</title></h:head>
    <h:body>
        <h:form id="reportsForm">
            <p:panel header="Reports">
                <p:link outcome="/dashboard" value="&#8592; Back to Dashboard"/>
                <br/><br/>

                <p:panel header="Revenue — last 6 months (Total: #{reportsBean.totalRevenueLast6Months})">
                </p:panel>

                <br/>

                <p:panel header="Doctor Performance">
                    <p:dataTable value="#{reportsBean.doctorPerformance}" var="row">
                        <p:column headerText="Doctor"><h:outputText value="#{row.doctorName}"/></p:column>
                        <p:column headerText="Completed Appointments"><h:outputText value="#{row.completedAppointments}"/></p:column>
                        <p:column headerText="Revenue Generated">
                            <h:outputText value="#{row.revenue}"><f:convertNumber type="currency" currencySymbol="$"/></h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:panel>
            </p:panel>
        </h:form>
    </h:body>
</html>
